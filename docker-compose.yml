services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskpay
      POSTGRES_PASSWORD: taskpay
      POSTGRES_DB: taskpay
    ports:
      - "5432:5432"
    volumes:
      - taskpay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpay -d taskpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - taskpay_redis:/data

volumes:
  taskpay_postgres:
  taskpay_redis:
